<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Business Preview</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --primary: #2563eb;
      --border: #dbe4f0;
      --soft: #eaf2ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    .topbar { background: #0f172a; color: #fff; padding: 12px 0; }
    .container { width: min(1120px, 92%); margin: 0 auto; }
    .topbar .container { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
    .badge { display: inline-block; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); padding: 7px 12px; border-radius: 999px; font-size: 0.92rem; }
    .btn { display: inline-block; padding: 12px 18px; border-radius: 10px; text-decoration: none; font-weight: 600; border: 1px solid transparent; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #fff; color: var(--primary); border-color: #cdddff; }
    .hero { background: linear-gradient(180deg, #fff, #f6f8fb); padding: 64px 0 32px; border-bottom: 1px solid var(--border); }
    .hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 28px; align-items: center; }
    .hero h1 { font-size: clamp(2.1rem, 5vw, 3.6rem); line-height: 1.08; margin: 0 0 16px; }
    .hero p { color: var(--muted); margin: 0 0 22px; max-width: 720px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 24px; box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05); }
    .section { padding: 28px 0; }
    .section h2 { margin: 0 0 12px; font-size: 1.8rem; }
    .muted { color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
    .service-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
    .feature-list, .faq-list { display: grid; gap: 16px; }
    .faq-item, .meta-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
    .footer-band { margin: 30px 0 50px; }
    .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container">
      <div class="badge">Preview generated from your business details</div>
      <div>
        <a class="btn btn-secondary" href="intake-form.html">Edit Details</a>
        <a class="btn btn-primary" href="#activate">Activate This Website</a>
      </div>
    </div>
  </div>

  <main id="previewRoot"></main>

  <script>
    const defaults = {
      businessName: 'Your Business Name',
      ownerName: 'Business Owner',
      category: 'Clinic',
      city: 'Your Area, Your City',
      phone: 'Contact Number',
      whatsapp: 'WhatsApp Number',
      address: 'Business address',
      maps: '',
      services: 'Professional local service for your customers.',
      customers: 'Local customers',
      timings: 'Monday to Saturday, 10 AM to 7 PM',
      topServices: 'Service One\nService Two\nService Three',
      usp: 'Trusted local business with simple and reliable customer support.',
      photos: '',
      goal: 'Calls',
      priceRange: '',
      language: 'English'
    };

    const categoryConfigs = {
      'Clinic': {
        headline: d => `Trusted Family Healthcare in ${d.city}`,
        subheadline: d => `Get professional consultation, easy appointment support, and patient-friendly care from ${d.businessName}.`,
        servicesTitle: 'Our Services',
        cta: 'Book Consultation',
        why: ['Trusted local care', 'Easy appointment support', 'Friendly guidance', 'Convenient patient contact'],
        faqs: [
          ['Do I need an appointment?', 'You can call or send a WhatsApp message before visiting.'],
          ['Do you provide routine checkups?', 'Yes, routine consultation support can be provided based on the clinic service list.'],
          ['How can I contact the clinic?', 'You can contact the clinic by phone or WhatsApp during working hours.']
        ]
      },
      'CA / Accountant': {
        headline: d => `Simple Tax and Compliance Support in ${d.city}`,
        subheadline: d => `${d.businessName} helps individuals and businesses with tax, GST, and compliance support in a practical and easy-to-understand way.`,
        servicesTitle: 'Core Services',
        cta: 'Book Consultation',
        why: ['Clear advice', 'MSME-friendly support', 'Timely service', 'Easy client communication'],
        faqs: [
          ['Do you work with small businesses?', 'Yes, this setup is designed for clear local business communication and enquiry flow.'],
          ['Can clients contact on WhatsApp?', 'Yes, call and WhatsApp contact can be highlighted clearly.'],
          ['Can this support tax and GST services?', 'Yes, services can be presented clearly on the website.']
        ]
      },
      'Tutor / Coaching': {
        headline: d => `Better Learning and Stronger Results in ${d.city}`,
        subheadline: d => `${d.businessName} helps students learn with confidence through simple teaching, regular practice, and easy parent communication.`,
        servicesTitle: 'Courses and Support',
        cta: 'Enquire Now',
        why: ['Clear teaching', 'Small batch feel', 'Parent-friendly communication', 'Simple enquiry flow'],
        faqs: [
          ['Which classes can be listed?', 'The website can clearly show classes, subjects, and batch timing details.'],
          ['Can parents enquire on WhatsApp?', 'Yes, direct enquiry via call or WhatsApp can be the main action.'],
          ['Can demo classes be promoted?', 'Yes, demo class CTA can be included clearly.']
        ]
      },
      'Salon': {
        headline: d => `Professional Beauty and Grooming Services in ${d.city}`,
        subheadline: d => `${d.businessName} can showcase beauty, grooming, and appointment support in a simple and polished way.`,
        servicesTitle: 'Popular Services',
        cta: 'Book Appointment',
        why: ['Clean service presentation', 'Easy booking support', 'WhatsApp-friendly enquiries', 'Professional local look'],
        faqs: [
          ['Can appointments be requested online?', 'Yes, the website can push users to call or message on WhatsApp.'],
          ['Can service photos be added later?', 'Yes, the site can start simple and improve with new photos.'],
          ['Can bridal or event services be shown?', 'Yes, premium service sections can be highlighted.']
        ]
      },
      'Gym': {
        headline: d => `Train Better with ${d.businessName}`,
        subheadline: d => `Show memberships, trainer support, and enquiry options clearly so more local people can discover your gym in ${d.city}.`,
        servicesTitle: 'Training Support',
        cta: 'Join Now',
        why: ['Stronger local visibility', 'Clear membership enquiry path', 'Simple class and trainer presentation', 'Easy lead capture'],
        faqs: [
          ['Can membership plans be shown?', 'Yes, pricing or plan highlights can be added clearly.'],
          ['Can users ask for trial visits?', 'Yes, trial enquiry CTA can be added.'],
          ['Can trainer support be highlighted?', 'Yes, personal training or class support can be shown.']
        ]
      },
      'Boutique': {
        headline: d => `Stylish Fashion Discovery in ${d.city}`,
        subheadline: d => `${d.businessName} can showcase collections, easy WhatsApp enquiries, and a more polished online brand presence.`,
        servicesTitle: 'Collections and Support',
        cta: 'Shop Enquiry',
        why: ['Stronger brand presentation', 'Easy WhatsApp product enquiry', 'Better local trust', 'Simple showcase of collections'],
        faqs: [
          ['Can collection photos be added?', 'Yes, collection images and highlights can be added easily.'],
          ['Can customers enquire about sizes or availability?', 'Yes, direct enquiry flow can be built around WhatsApp or call.'],
          ['Can offers or new arrivals be promoted?', 'Yes, special collection or seasonal sections can be shown.']
        ]
      }
    };

    function loadData() {
      try {
        const stored = localStorage.getItem('businessPreviewData');
        if (!stored) return defaults;
        return { ...defaults, ...JSON.parse(stored) };
      } catch {
        return defaults;
      }
    }

    function serviceList(data) {
      const top = (data.topServices || '').split(/\n|,/).map(s => s.trim()).filter(Boolean);
      if (top.length) return top.slice(0, 6);
      return ['Service One', 'Service Two', 'Service Three'];
    }

    function render() {
      const data = loadData();
      const config = categoryConfigs[data.category] || categoryConfigs['Clinic'];
      const services = serviceList(data);
      const primaryGoal = data.goal || 'Calls';
      const root = document.getElementById('previewRoot');
      root.innerHTML = `
        <section class="hero">
          <div class="container hero-grid">
            <div>
              <div class="badge" style="background: var(--soft); color: var(--primary); border: 1px solid #cdddff;">${data.category || 'Business'} Preview</div>
              <h1>${config.headline(data)}</h1>
              <p>${config.subheadline(data)}</p>
              <div>
                <a class="btn btn-primary" href="#activate">Activate This Website</a>
                <a class="btn btn-secondary" href="#contact">View Contact Section</a>
              </div>
            </div>
            <div class="card">
              <h3 style="margin-top:0;">Preview Summary</h3>
              <p class="muted">This sample preview has been generated from your business details.</p>
              <ul>
                <li><strong>Business:</strong> ${data.businessName}</li>
                <li><strong>Category:</strong> ${data.category}</li>
                <li><strong>Location:</strong> ${data.city}</li>
                <li><strong>Main goal:</strong> ${primaryGoal}</li>
                <li><strong>Hours:</strong> ${data.timings}</li>
              </ul>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="container">
            <h2>${config.servicesTitle}</h2>
            <p class="muted">These sections are adapted from the details you entered.</p>
            <div class="grid">
              ${services.map(item => `<div class="service-card"><strong>${item}</strong><p class="muted">A clear service section can be created for this offer inside your website.</p></div>`).join('')}
            </div>
          </div>
        </section>

        <section class="section">
          <div class="container">
            <div class="card">
              <h2>About ${data.businessName}</h2>
              <p>${data.services || defaults.services}</p>
              <p><strong>Why customers choose this business:</strong> ${data.usp || defaults.usp}</p>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="container">
            <h2>Why this website can work for your business</h2>
            <div class="grid">
              ${config.why.map(item => `<div class="meta-card"><strong>${item}</strong><p class="muted">This can be shown clearly to help customers trust and contact your business faster.</p></div>`).join('')}
            </div>
          </div>
        </section>

        <section class="section">
          <div class="container">
            <h2>Frequently Asked Questions</h2>
            <div class="faq-list">
              ${config.faqs.map(([q,a]) => `<div class="faq-item"><strong>${q}</strong><p class="muted">${a}</p></div>`).join('')}
            </div>
          </div>
        </section>

        <section class="section" id="contact">
          <div class="container meta-grid">
            <div class="meta-card"><strong>Business Name</strong><p class="muted">${data.businessName}</p></div>
            <div class="meta-card"><strong>Location</strong><p class="muted">${data.city}</p></div>
            <div class="meta-card"><strong>Phone</strong><p class="muted">${data.phone}</p></div>
            <div class="meta-card"><strong>WhatsApp</strong><p class="muted">${data.whatsapp}</p></div>
            <div class="meta-card"><strong>Hours</strong><p class="muted">${data.timings}</p></div>
            <div class="meta-card"><strong>Main Audience</strong><p class="muted">${data.customers}</p></div>
          </div>
        </section>

        <section class="footer-band" id="activate">
          <div class="container card">
            <h2>Activate your website</h2>
            <p class="muted">This is a generated preview based on your business details. The final live website can include your complete business branding, contact flow, and polished category layout.</p>
            <div>
              <a class="btn btn-primary" href="intake-form.html">Update Details</a>
              <a class="btn btn-secondary" href="index.html">Back to Main Site</a>
            </div>
          </div>
        </section>
      `;
    }

    render();
  </script>
</body>
</html>
